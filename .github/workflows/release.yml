name: Release

# Publishing uses npm Trusted Publishing (OIDC): no long-lived npm token exists
# in this repository. Configure the trusted publisher on npmjs.com with
#   Organization or user: Flyvhidbwo
#   Repository:           dsh-vision-proxy
#   Workflow filename:    release.yml
#   Allowed actions:      npm publish (npm stage publish is always allowed)
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required: lets npm exchange a GitHub OIDC token for a short-lived publish token
  contents: read

jobs:
  publish:
    name: Publish to npm (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      # Trusted publishing needs npm CLI >= 11.5.1
      - run: npm install -g npm@11

      - name: Verify the tag matches package.json
        run: |
          node -e "const pkg = require('./package.json'); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (pkg.version !== tag) { console.error('package.json version ' + pkg.version + ' != tag ' + tag); process.exit(1); }"

      - run: npm install --no-audit --no-fund --omit=optional
      - run: npm test

      - name: Reject UTF-8 BOM in package.json (dsh cannot parse it)
        run: node scripts/check-no-bom.js

      # OIDC authentication is automatic; provenance is generated by default
      # because this is a public package in a public repository.
      - run: npm publish --access public
